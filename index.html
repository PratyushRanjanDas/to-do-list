<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="todo-app">
            <h1>To-Do App</h1>
            <form class="input-area">
                <input type="text" id="task-input" placeholder="Add a new task..." autocomplete="off">
                <button type="submit" id="add-task-btn" aria-label="Add task">
                    <i class="fa-solid fa-plus"></i>
                </button>
            </form>

            <div class="task-stats" role="status" aria-live="polite">
                <span id="remaining-count">0</span> left • <span id="total-count">0</span> total
            </div>

            <div class="todos-container">
                <ul id="task-list"></ul>
                <img src="./images/empty.png" alt="No tasks" id="empty-img">
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
